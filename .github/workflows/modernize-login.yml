name: Modernize login screen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  modernize-login:
    if: ${{ !contains(github.event.head_commit.message, 'ui: modernize login screen') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace login screen
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start_marker = '    <!-- LOGIN MODAL SCREEN -->'
          end_marker = '    <!-- MAIN APP WRAPPER -->'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          login = r'''    <!-- LOGIN MODAL SCREEN -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden bg-slate-950/95 px-4 py-6 sm:px-6">
        <div class="pointer-events-none absolute inset-0 overflow-hidden">
            <div class="absolute -right-32 -top-32 h-96 w-96 rounded-full bg-emerald-500/20 blur-3xl"></div>
            <div class="absolute -bottom-40 -left-32 h-[28rem] w-[28rem] rounded-full bg-cyan-500/15 blur-3xl"></div>
            <div class="absolute left-1/2 top-1/3 h-72 w-72 -translate-x-1/2 rounded-full bg-indigo-500/10 blur-3xl"></div>
            <div class="absolute inset-0 opacity-[0.035]" style="background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);background-size:28px 28px"></div>
        </div>

        <div class="relative grid w-full max-w-5xl overflow-hidden rounded-[2rem] border border-white/10 bg-slate-900/75 shadow-2xl shadow-black/50 backdrop-blur-2xl lg:grid-cols-[1.05fr_.95fr]">
            <div class="relative hidden min-h-[570px] overflow-hidden bg-gradient-to-br from-emerald-950 via-slate-900 to-slate-950 p-10 lg:flex lg:flex-col lg:justify-between">
                <div class="absolute -right-20 top-16 h-64 w-64 rounded-full border border-emerald-400/10"></div>
                <div class="absolute -right-8 top-28 h-40 w-40 rounded-full border border-emerald-400/10"></div>
                <div class="relative">
                    <div class="mb-8 flex items-center gap-3">
                        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-600 text-white shadow-lg shadow-emerald-500/25">
                            <i class="fa-solid fa-route text-xl"></i>
                        </div>
                        <div>
                            <div class="text-xs font-black tracking-[0.25em] text-emerald-400">AKASRA</div>
                            <div class="mt-0.5 text-xs text-slate-400">Smart Mission Management</div>
                        </div>
                    </div>
                    <span class="inline-flex items-center gap-2 rounded-full border border-emerald-400/20 bg-emerald-400/10 px-3 py-1.5 text-[10px] font-bold text-emerald-300">
                        <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-emerald-400"></span>
                        سامانه سازمانی هوشمند
                    </span>
                    <h1 class="mt-6 max-w-md text-3xl font-black leading-[1.6] text-white">مدیریت مأموریت، پروژه و هزینه‌ها<br><span class="text-emerald-400">یکپارچه و هوشمند</span></h1>
                    <p class="mt-5 max-w-md text-sm leading-8 text-slate-400">ثبت و مدیریت مأموریت‌ها، کنترل هزینه‌های رفت‌وآمد، گزارش‌گیری مدیریتی و دستیار هوشمند در یک محیط امن و حرفه‌ای.</p>
                </div>
                <div class="relative grid grid-cols-3 gap-3">
                    <div class="rounded-2xl border border-white/10 bg-white/[0.04] p-4 text-center">
                        <i class="fa-solid fa-chart-line mb-2 text-emerald-400"></i>
                        <div class="text-[10px] font-bold text-slate-300">گزارش مدیریتی</div>
                    </div>
                    <div class="rounded-2xl border border-white/10 bg-white/[0.04] p-4 text-center">
                        <i class="fa-solid fa-cloud mb-2 text-sky-400"></i>
                        <div class="text-[10px] font-bold text-slate-300">داده ابری</div>
                    </div>
                    <div class="rounded-2xl border border-white/10 bg-white/[0.04] p-4 text-center">
                        <i class="fa-solid fa-wand-magic-sparkles mb-2 text-purple-400"></i>
                        <div class="text-[10px] font-bold text-slate-300">هوش مصنوعی</div>
                    </div>
                </div>
            </div>

            <div class="relative flex min-h-[570px] flex-col justify-center p-6 sm:p-10">
                <div class="absolute left-5 top-5 flex items-center gap-2 rounded-full border border-emerald-400/15 bg-emerald-400/5 px-3 py-1.5 text-[9px] font-bold text-emerald-300">
                    <i class="fa-solid fa-shield-halved"></i> محیط ورود محافظت‌شده
                </div>

                <div class="mx-auto w-full max-w-sm">
                    <div class="mb-7 text-center lg:text-right">
                        <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-[1.6rem] bg-gradient-to-br from-emerald-400 via-emerald-500 to-teal-700 text-white shadow-xl shadow-emerald-500/25 lg:mx-0">
                            <i class="fa-solid fa-lock-keyhole text-3xl"></i>
                        </div>
                        <h2 class="text-2xl font-black text-white">خوش آمدید 👋</h2>
                        <p class="mt-2 text-xs leading-6 text-slate-400">برای ورود به پنل مدیریت، اطلاعات حساب خود را وارد کنید.</p>
                    </div>

                    <div class="mb-5 flex items-center justify-center gap-3 rounded-2xl border border-white/10 bg-white/[0.035] px-4 py-3 lg:justify-start">
                        <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-amber-400/10 text-amber-400"><i class="fa-solid fa-clock text-xs"></i></div>
                        <div>
                            <div id="loginLiveClock" class="font-mono text-sm font-bold tracking-wider text-white">۰۰:۰۰:۰۰</div>
                            <div id="loginLiveDate" class="mt-0.5 text-[9px] text-slate-500">در حال دریافت تاریخ...</div>
                        </div>
                        <span class="mr-auto hidden rounded-full bg-emerald-400/10 px-2 py-1 text-[9px] font-bold text-emerald-400 sm:block">ONLINE</span>
                    </div>

                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="mb-2 block text-xs font-bold text-slate-300">نام کاربری</label>
                            <div class="relative">
                                <div class="absolute right-0 top-0 flex h-full w-11 items-center justify-center text-slate-500"><i class="fa-solid fa-user text-xs"></i></div>
                                <input type="text" id="loginUsername" required autocomplete="username" placeholder="نام کاربری خود را وارد کنید" class="glass-input w-full rounded-2xl py-3.5 pl-4 pr-11 text-sm">
                            </div>
                        </div>

                        <div>
                            <div class="mb-2 flex items-center justify-between">
                                <label class="block text-xs font-bold text-slate-300">کلمه عبور</label>
                                <span class="text-[9px] text-slate-500"><i class="fa-solid fa-lock ml-1"></i>رمز شما محرمانه است</span>
                            </div>
                            <div class="relative">
                                <div class="absolute right-0 top-0 flex h-full w-11 items-center justify-center text-slate-500"><i class="fa-solid fa-key text-xs"></i></div>
                                <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="کلمه عبور را وارد کنید" class="glass-input w-full rounded-2xl py-3.5 pl-12 pr-11 text-sm">
                                <button type="button" onclick="toggleLoginPassword()" class="absolute left-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-xl text-slate-500 transition hover:bg-emerald-500/10 hover:text-emerald-400" title="نمایش / مخفی‌سازی رمز" aria-label="نمایش یا مخفی‌سازی رمز">
                                    <i id="loginPassVisIcon" class="fa-solid fa-eye text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <div id="loginError" class="hidden rounded-2xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-xs font-medium leading-6 text-red-300">
                            <i class="fa-solid fa-circle-exclamation ml-1"></i><span>نام کاربری یا کلمه عبور اشتباه است.</span>
                        </div>

                        <button id="loginSubmitBtn" type="submit" class="btn-touch group relative w-full overflow-hidden rounded-2xl bg-gradient-to-l from-emerald-600 to-teal-500 py-3.5 text-sm font-black text-white shadow-xl shadow-emerald-600/20 transition-all hover:-translate-y-0.5 hover:from-emerald-500 hover:to-teal-400 focus:outline-none focus:ring-4 focus:ring-emerald-500/20">
                            <span class="relative flex items-center justify-center gap-2"><i class="fa-solid fa-right-to-bracket"></i><span>ورود به سامانه</span></span>
                        </button>
                    </form>

                    <div class="mt-7 border-t border-white/10 pt-5">
                        <div class="flex items-center justify-center gap-2 text-[9px] text-slate-500">
                            <span class="font-black tracking-widest text-emerald-400">AKASRA</span>
                            <span>•</span>
                            <span>مدیریت هوشمند هزینه مأموریت</span>
                        </div>
                        <div class="mt-2 text-center text-[8px] text-slate-600">دسترسی فقط برای کاربران مجاز سیستم</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

'''
          p.write_text(s[:start] + login + s[end:], encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ui: modernize login screen"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/modernize-login.yml
          git commit -m "chore: remove temporary login migration workflow"
          git push
